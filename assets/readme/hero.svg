<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">ralph: a Ralph loop for Claude Code that runs for days</title>
  <desc id="desc">The ralph logo and name, the line "Every iteration is a fresh claude -p. Git, not the model, decides what shipped.", and an illustrative ralph.log excerpt: iteration 41 shipped a commit, and iteration 42 was reverted to that commit because verify failed.</desc>

  <rect x="1" y="1" width="1198" height="498" rx="24" fill="#0F1115" stroke="#2A2F3A" stroke-width="2"/>

  <g id="title-block">
    <text x="56" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#FF8A4C">FOR CLAUDE CODE  ·  RUNS FOR DAYS  ·  GATED BY GIT</text>

    <g id="mark" transform="translate(56 92) scale(0.4375)">
      <rect x="4" y="4" width="248" height="248" rx="56" fill="#171A21" stroke="#2A2F3A" stroke-width="3"/>
      <path d="M 186.2 79.1 A 76 76 0 1 1 106.6 55.1" fill="none" stroke="#FF8A4C" stroke-width="18" stroke-linecap="round"/>
      <path d="M 131 47 L 101 36.5 L 112.2 74.3 Z" fill="#FF8A4C" stroke="#FF8A4C" stroke-width="6" stroke-linejoin="round"/>
      <g fill="none" stroke="#F4EFE6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="90,104 116,128 90,152"/>
        <line x1="130" y1="152" x2="166" y2="152"/>
      </g>
      <circle cx="74.3" cy="181.7" r="15" fill="#46D39A" stroke="#171A21" stroke-width="7"/>
    </g>

    <text x="192" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-4" fill="#F4EFE6">ralph</text>

    <line x1="548" y1="104" x2="548" y2="196" stroke="#2A2F3A" stroke-width="2"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#F4EFE6">
      <text x="580" y="130">Every iteration is a fresh <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#FF8A4C">claude -p</tspan>.</text>
      <text x="580" y="166">Git, not the model, decides what shipped.</text>
    </g>
    <text x="580" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B93A1">worktree · verify gate · reviewer · steer</text>
  </g>

  <g id="log">
    <rect x="56" y="240" width="1088" height="212" rx="14" fill="#171A21" stroke="#262B36" stroke-width="2"/>
    <circle cx="84" cy="266" r="6" fill="#FF6B6B"/>
    <circle cx="104" cy="266" r="6" fill="#F5C451"/>
    <circle cx="124" cy="266" r="6" fill="#46D39A"/>
    <line x1="56" y1="290" x2="1144" y2="290" stroke="#262B36" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#C9CED6" xml:space="preserve">
      <text x="148" y="272" fill="#8B93A1">ralph tail audit</text>
      <text x="84" y="324"><tspan fill="#6B7280">[2026-09-29 02:14:07]</tspan> <tspan fill="#FF8A4C">=== iteration 41 (HEAD 9e2c41a) ===</tspan></text>
      <text x="84" y="356"><tspan fill="#6B7280">[2026-09-29 02:39:52]</tspan> iteration 41 <tspan fill="#46D39A">shipped 3f9c2e1</tspan> in 1545s</text>
      <text x="84" y="388"><tspan fill="#6B7280">[2026-09-29 02:40:22]</tspan> <tspan fill="#FF8A4C">=== iteration 42 (HEAD 3f9c2e1) ===</tspan></text>
      <text x="84" y="420"><tspan fill="#6B7280">[2026-09-29 03:02:10]</tspan> iteration 42 <tspan fill="#FF6B6B">reverted to 3f9c2e1: revert:verify</tspan> — verify exited 1</text>
    </g>
  </g>
</svg>
