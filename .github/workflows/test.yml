name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Pinned rather than ubuntu-latest, so the runner image moving underneath the
  # suite is a change someone makes, not one that happens to it.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: unit tests
        run: bun test --timeout 600000 tests/unit
      - name: end-to-end tests
        run: bun test --timeout 600000 tests/e2e

  # Most loops run on a Mac, and ps, process groups and the temporary
  # directories differ there. macOS minutes cost ten times as much on private
  # repositories, so this job runs once the repository is public, or by hand.
  macos:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: tests
        run: bun test --timeout 600000 tests/unit tests/e2e
