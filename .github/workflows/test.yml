name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Pinned rather than ubuntu-latest, so the runner image moving underneath the
  # suite is a change someone makes, not one that happens to it.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: unit tests
        run: bun test --timeout 600000 tests/unit
      - name: end-to-end tests
        run: bun test --timeout 600000 tests/e2e

  # Most loops run on a Mac, and ps, process groups and the temporary
  # directories differ there. macOS minutes cost ten times as much on private
  # repositories, so this job runs once the repository is public, or by hand.
  macos:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: tests
        run: bun test --timeout 600000 tests/unit tests/e2e

  # What npm would ship, installed the way a user installs it. A runtime file
  # left out of "files" in package.json fails here, not on someone's machine.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pack and install
        run: |
          npm pack
          npm install -g --prefix "$RUNNER_TEMP/g" ./vkuprin-ralph-harness-*.tgz
      - name: the installed CLI scaffolds a loop
        env:
          RALPH_HOME: ${{ runner.temp }}/home
        run: |
          ralph="$RUNNER_TEMP/g/bin/ralph"
          "$ralph" --version
          git init -q "$RUNNER_TEMP/app"
          git -C "$RUNNER_TEMP/app" -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m init
          "$ralph" new smoke "$RUNNER_TEMP/app"
          "$ralph" status smoke

  # Runs only on a commit every job above passed. With changesets pending it
  # opens or updates the release PR; once that PR is merged it publishes to npm
  # (trusted publishing, no token), tags vX.Y.Z, writes the GitHub Release and
  # bumps the Homebrew formula in vkuprin/homebrew-tap.
  release:
    needs: [linux, macos, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2
        with:
          publish-script: bunx changeset publish
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - id: version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - if: steps.changesets.outputs.published == 'true'
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: ralph
          homebrew-tap: vkuprin/homebrew-tap
          tag-name: v${{ steps.version.outputs.version }}
          download-url: https://github.com/vkuprin/ralph-harness/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
