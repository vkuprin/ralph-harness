name: test

# Scratch branch ci-debug/windows, never merged: a Windows-only job that runs
# the diagnostics and the failing tests, dispatched by hand.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: process tree under each kill
        continue-on-error: true
        run: bun debug/tree.ts
      - name: ralph start refusals, five times
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::run $i"
            bun test --timeout 600000 tests/e2e/cli.test.ts -t "ralph start says so when the loop did not start" || echo "RUN $i FAILED"
            echo "::endgroup::"
          done
      - name: start trace
        if: always()
        run: cat /c/ralph-debug/start.log || true
      - name: the fetch transport test
        continue-on-error: true
        run: bun test --timeout 600000 tests/e2e/edges.test.ts -t "a fetch that never answers"
