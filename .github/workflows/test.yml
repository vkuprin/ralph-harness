name: test

# Scratch branch ci-debug/windows, never merged: the Windows job, dispatched by
# hand, with every CLI run traced to C:\ralph-debug\start.log.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: process tree under each kill
        continue-on-error: true
        run: bun debug/tree.ts
      - name: unit tests
        continue-on-error: true
        run: bun test --timeout 600000 tests/unit
      - name: end-to-end tests
        continue-on-error: true
        run: bun test --timeout 600000 tests/e2e
      - name: CLI runs that never exited
        if: always()
        run: |
          f=/c/ralph-debug/start.log
          test -f "$f" || exit 0
          echo "lines: $(wc -l < "$f")"
          for p in $(grep -o 'cli=[0-9]* loaded' "$f" | cut -d= -f2 | cut -d' ' -f1 | sort -u); do
            grep -q "cli=$p exit" "$f" || { echo "== no exit: $p"; grep "cli=$p " "$f"; }
          done
